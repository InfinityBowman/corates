packages:
  - packages/*

# Our own packages skip the release-age hold (owner-published; protocol 0.1.1
# would otherwise be held until 2026-08-06). Everything else keeps the global
# minimumReleaseAge protection.
minimumReleaseAgeExclude:
  - '@cf-sync/*'

# better-auth's peer range still allows only better-sqlite3 ^12 while workers
# ships ^13, which made pnpm keep two peer-variants of drizzle-orm. Two
# variants split drizzle's SQL type identity between @corates/db and web and
# break typecheck, so force a single resolution until better-auth widens its
# peer range.
overrides:
  better-sqlite3: ^13.0.2

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  agent-browser: true
  better-sqlite3: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
  core-js: false
