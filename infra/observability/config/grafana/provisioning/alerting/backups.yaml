apiVersion: 1

# Daily project backup sweep, prod only.
#
# Whether the sweep ran is read from R2 through /api/backup-status, not from the
# backup.completed log line: the log export drops lines, so an absence rule on it
# fired on nights the snapshots were all written. The endpoint checks the day
# whose 05:00 UTC sweep has had 2h to finish.
#
# The skipped-project rule stays on logs because the pre-delete snapshot has no
# daily key to check; a dropped line there can only hide an alert, never raise one.
groups:
  - orgId: 1
    name: backups
    folder: CoRATES
    interval: 15m
    rules:
      - uid: corates-backup-sweep-missing
        title: Daily project backup missing from R2
        condition: threshold
        for: 15m
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: corates-api
            model:
              refId: query
              type: json
              source: url
              parser: backend
              format: table
              url: https://corates.org/api/backup-status
              url_options: { method: GET }
              root_selector: ''
              columns:
                - { selector: missing, text: missing, type: number }
          - refId: threshold
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $values.query.Value }} project(s) have no snapshot from the latest backup sweep'
          description: >-
            corates-backups-prod has no snapshots/<projectId>/<date>.json.gz for
            the latest 05:00 UTC sweep. Every project missing means the cron did
            not fire or threw (Sentry has the exception); a few means the sweep
            skipped them (see backup.failed). R2 lifecycle still expires
            snapshots/ at 60 days. GET https://corates.org/api/backup-status with
            the bearer token in .env lists them as missingProjectIds.

      - uid: corates-backup-project-failed
        title: A project was skipped by the backup sweep
        condition: threshold
        for: 15m
        data:
          - refId: query
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: query
              queryType: instant
              expr: >-
                sum by (stage, projectId) (count_over_time({service_name="corates-workers-prod"}
                | json | message="backup.failed" [26h])) or vector(0)
          - refId: threshold
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Backup failed for project {{ $labels.projectId }} (stage {{ $labels.stage }})'
          description: >-
            The sweep logs and skips a broken project so one project cannot hide
            the rest. stage=sweep means that project has no snapshot for the day;
            stage=pre-delete means a project was torn down without its final
            deleted/ copy, which nothing retries.
            Logs: {service_name="corates-workers-prod"} | json | message="backup.failed"
