# Loki in monolithic mode, chunks and index stored in the corates-loki R2 bucket.
# R2 credentials are injected as env vars by compose (-config.expand-env=true).

auth_enabled: false # auth is enforced by Traefik basic auth in front

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  replication_factor: 1
  path_prefix: /loki
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: https://2ab59c3eb44887bfa2bac00afd32290a.r2.cloudflarestorage.com
      bucketnames: corates-loki
      access_key_id: ${R2_ACCESS_KEY_ID}
      secret_access_key: ${R2_SECRET_ACCESS_KEY}
      region: auto
      s3forcepathstyle: true

schema_config:
  configs:
    - from: '2026-08-08'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Entries older than max_chunk_age/2 are rejected; Cloudflare redelivers failed
  # batches up to ~6h late, so 24h gives a 12h window.
  max_chunk_age: 24h

querier:
  # Default 3h would hide unflushed data older than that until the chunk flushes
  query_ingesters_within: 0
  # A dashboard fires every panel at once (product-usage is 39 queries). The default of 4
  # workers serialises them behind each other, so panels queue rather than run.
  max_concurrent: 16

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

limits_config:
  # 0s keeps logs forever. retention_enabled stays true above so the compactor still
  # compacts the index and can serve delete requests; with no period it deletes nothing.
  retention_period: 0s
  # Default 721h rejects anything past a month. A query's range and its range-vector
  # window are both charged against this, so keep it clear of the longest panel window.
  max_query_length: 43800h # 5 years
  # Default 500 is thin for route/url_path cardinality
  max_query_series: 5000
  # Required for OTLP ingestion; OTLP attributes land as structured metadata
  allow_structured_metadata: true
  # Truncate lines over max_line_size (256KB) instead of dropping them outright
  max_line_size_truncate: true
  # Both defaults are 1h, which turns a 7d panel into 168 subqueries and a 30d panel into
  # 720. At this volume (~50MB/week) the per-split overhead costs far more than the scan
  # it parallelises. The two knobs are independent: range queries use the first, instant
  # queries (the topk tables and every [$__range] stat) use the second.
  split_queries_by_interval: 24h
  split_instant_metric_queries_by_interval: 24h

analytics:
  reporting_enabled: false

query_range:
  # Both default to off. Only a dashboard reload on an unchanged window hits these, but
  # that is the common case when reading a dashboard, and it drops a 7d load to ~0.1s.
  cache_results: true
  cache_instant_metric_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 500
  instant_metric_results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 200
