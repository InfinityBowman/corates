name: corates-observability

# Deployed to the homelab box via `./deploy.sh` (docker context "homelab").
# Bind-mount sources reference paths on the box; deploy.sh rsyncs config/ there first.
# Traefik (homelab-traefik) picks up the labels and routes the wildcard tunnel hostnames.

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: corates-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - /home/jacob/corates/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - homelab
    labels:
      traefik.enable: 'true'
      traefik.http.routers.corates-loki.rule: Host(`loki.jacobmaynard.dev`)
      traefik.http.routers.corates-loki.entrypoints: web
      # Not secure-chain@file: its shared rate-limit 429s Cloudflare's export pushes (see README)
      traefik.http.routers.corates-loki.middlewares: corates-loki-auth
      traefik.http.middlewares.corates-loki-auth.basicauth.users: ${LOKI_BASIC_AUTH}
      traefik.http.services.corates-loki.loadbalancer.server.port: '3100'

  grafana:
    image: grafana/grafana:13.1.3
    container_name: corates-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.jacobmaynard.dev
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Sync so the plugin exists before datasource provisioning runs (GF_INSTALL_PLUGINS is deprecated and installs after startup)
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      # Read by the datasource provisioning file, not by Grafana itself
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - /home/jacob/corates/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - homelab
      # Plausible's ClickHouse lives only on this network (home-lab repo, services/plausible)
      - plausible-internal
    labels:
      traefik.enable: 'true'
      traefik.http.routers.corates-grafana.rule: Host(`grafana.jacobmaynard.dev`)
      traefik.http.routers.corates-grafana.entrypoints: web
      # Same rate-limit problem for Grafana's parallel panel queries
      traefik.http.routers.corates-grafana.middlewares: security-headers@file
      traefik.http.services.corates-grafana.loadbalancer.server.port: '3000'

volumes:
  loki-data:
  grafana-data:

networks:
  homelab:
    external: true
  plausible-internal:
    external: true
    name: plausible_plausible-internal
