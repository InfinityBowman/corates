name: E2E Staging (manual)

# Runs the Playwright suite against the live staging deployment. Two entry
# points:
#   - workflow_dispatch: test whatever is already deployed to staging, using
#     the spec files from the dispatched ref.
#   - workflow_call: chained from deploy-staging.yml when its run_e2e input is
#     set, so one dispatch can deploy a branch and then test it.
#
# This never deploys. If the specs on this ref expect code that is not on
# staging yet, deploy first (deploy-staging.yml).

on:
  workflow_dispatch:
  workflow_call:

# Staging is a single shared environment and the suite seeds data into it, so
# concurrent runs would interfere. Queue rather than cancel: a cancelled run
# can leave half-seeded state behind.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  # On the host rather than the Playwright container, for the reasons given on
  # ci.yml's e2e job.
  e2e:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          build-workspace: 'false'

      # Per-runner browser cache, for the same reasons as the pnpm store. A
      # no-op once the build matching @playwright/test is present.
      - name: Install Chromium
        run: |
          browsers="$(dirname "$RUNNER_WORKSPACE")/ms-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$browsers" pnpm --filter web exec playwright install chromium

      - name: Run e2e tests
        env:
          PLAYWRIGHT_BASE_URL: 'https://staging.corates.org'
        working-directory: packages/web
        run: pnpm test:e2e

      # always(), not failure(): a test that fails then passes on retry leaves a
      # trace behind but keeps the job green, and that is exactly the run worth
      # diagnosing. A clean run still uploads the handful of debug screenshots
      # the rob2/robins specs write into test-results/ unconditionally.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "E2E on staging for \`${{ github.ref_name }}\` (${GITHUB_SHA:0:8}): ${{ job.status }}." >> "$GITHUB_STEP_SUMMARY"
