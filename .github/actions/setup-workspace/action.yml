name: Setup workspace
description: pnpm, Node, install, and optionally build the shared workspace packages.

inputs:
  build-workspace:
    description: Build @corates/shared and @corates/db after installing
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build workspace dependencies
      if: inputs.build-workspace == 'true'
      shell: bash
      run: pnpm --filter @corates/shared --filter @corates/db build
